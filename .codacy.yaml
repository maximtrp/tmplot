---
# Prospector, Pylint and Ruff keep analysing tests/ — only the checks that are
# meaningless there are scoped out.
engines:
  bandit:
    # B101: asserts are how tests assert. B301/B403: the pickled fixtures are
    # written by the suite itself, not untrusted input.
    exclude_paths:
      - "tests/**"
  duplication:
    exclude_paths:
      - "tests/**"
  metric:
    exclude_paths:
      - "tests/**"

exclude_paths:
  - "build/**"
  - "dist/**"
  - "temp/**"
  - "docs/**"
