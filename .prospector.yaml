strictness: medium
doc-warnings: true
test-warnings: true

ignore-paths:
  - build
  - dist
  - temp
  - docs

pydocstyle:
  disable:
    # D212 and D213 are mutually exclusive; this codebase uses D212.
    - D213
    - D203
    - D404
    # numpydoc section spacing and first-line punctuation are formatting churn.
    - D205
    - D209
    - D400
    - D401
    - D403
    - D413
    - D415
    - D104
    - D107

pylint:
  disable:
    - too-many-arguments
    - too-many-positional-arguments
    - too-many-branches
    - too-many-statements
    - too-many-locals
    - too-many-instance-attributes
    - too-many-public-methods
    - too-few-public-methods
    - duplicate-code
    - import-outside-toplevel
    - missing-module-docstring
    - missing-class-docstring
    - missing-function-docstring
    - invalid-name
    - unused-argument
    # The regression suite exercises the private adapter helpers directly.
    - protected-access
    # tomotopy/gensim/bitermplus are optional extras that need not be present
    # in the analysis environment; ruff already catches genuine import errors.
    - import-error
    - too-many-return-statements
    - too-many-lines
    - fixme

mccabe:
  options:
    # The plotting and report wrappers branch once per optional widget.
    max-complexity: 25
